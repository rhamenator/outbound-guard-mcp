[package]
name = "outbound-guard-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "A guarded HTTP egress MCP server for coding agents"
repository = "https://github.com/rhamenator/outbound-guard-mcp"

[dependencies]
serde_json = { version = "1", features = ["arbitrary_precision"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

tokio = { version = "1", features = ["rt", "time"] }

[profile.release]
strip = "symbols"
panic = "abort"
