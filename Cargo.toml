[package]
name = "outbound-guard-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "A guarded HTTP egress MCP server for coding agents"
repository = "https://github.com/rhamenator/outbound-guard-mcp"

[dependencies]
serde_json = { version = "1", features = ["arbitrary_precision"] }
url = "2"
tokio = { version = "1", features = ["rt", "time", "net", "io-util"] }
bytes = "1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[profile.release]
strip = "symbols"
panic = "abort"
