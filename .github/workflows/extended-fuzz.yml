name: Extended offline fuzz
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [policy, frame, rpc, json]
        default: rpc
        required: true
      seconds:
        type: choice
        options: ['60', '300', '600']
        default: '300'
        required: true
permissions:
  contents: read
concurrency:
  group: extended-offline-fuzz-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Read pinned compiler
        id: compiler
        run: python3 -c 'import tomllib; print("channel="+tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
      - name: Install pinned-distribution runtime and fetch locked crates
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-rt-18-dev
          cargo fetch --locked
      - name: Run bounded network-free campaign
        env:
          POLICY_FUZZ_TARGET: ${{ inputs.target }}
          POLICY_FUZZ_SECONDS: ${{ inputs.seconds }}
        run: |
          export LIBFUZZER_RUNTIME="$(clang-18 --print-file-name=libclang_rt.fuzzer_no_main-x86_64.a)"
          export POLICY_FUZZ_CLANG=clang-18
          export POLICY_FUZZ_OUTPUT="$RUNNER_TEMP/extended-fuzz-evidence"
          bash tools/policy_fuzz.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: extended-offline-fuzz-evidence
          path: ${{ runner.temp }}/extended-fuzz-evidence
          retention-days: 7
