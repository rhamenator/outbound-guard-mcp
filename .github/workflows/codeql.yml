name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: rust
      - name: Read pinned build compiler
        id: compiler
        run: python3 -c 'import os, tomllib; channel = tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"]; print("channel=" + channel, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
      - run: cargo build --locked
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
