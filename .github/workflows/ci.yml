name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  retained-dns-packets:
    name: Retained DNS and HTTP packet evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0 # Historical native evidence hashes source files from the recorded commit.
      - name: Install packet inspection tool
        run: |
          # Hosted runners may point at an unresponsive Azure mirror. Keep this
          # test-tool install on the official Noble archive and bound I/O wait.
          echo 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe' > "$RUNNER_TEMP/outbound-ubuntu.list"
          apt_source=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/outbound-ubuntu.list" -o Dir::Etc::sourceparts=-)
          sudo timeout 360s apt-get "${apt_source[@]}" -o Acquire::Retries=0 -o Acquire::https::Timeout=30 -o Acquire::Languages=none update
          sudo env DEBIAN_FRONTEND=noninteractive timeout 300s apt-get "${apt_source[@]}" -o Acquire::Retries=0 -o Acquire::https::Timeout=30 install -y tshark
          tshark --version
      - name: Recheck retained DNS capture digests and wire behavior
        run: python3 tools/verify_native_dns_corpus.py
      - name: Recheck forged DNS transaction-ID native captures
        run: python3 tools/verify_native_dns_spoof_corpus.py
      - name: Recheck retained malformed HTTP capture digests and wire behavior
        run: python3 tools/verify_native_http_framing_corpus.py
      - name: Reject altered native compressed-bomb captures
        run: python3 tools/verify_native_bomb_oracle_negative_controls.py
      - name: Recheck native informational slow-drip packet evidence
        run: python3 tools/verify_native_interim_slow_corpus.py
      - name: Recheck native connect-blackhole packet evidence
        run: python3 tools/verify_native_connect_blackhole_corpus.py
      - name: Recheck native DNS answer-limit packet evidence
        run: python3 tools/verify_native_dns_answer_limit_corpus.py
      - name: Recheck native exact DNS answer-cap packet evidence
        run: python3 tools/verify_native_dns_boundary_corpus.py
      - name: Recheck native slow HTTP socket close timing
        run: python3 tools/verify_native_slow_close_corpus.py
      - name: Reject a late native slow HTTP socket close
        run: python3 tools/verify_native_slow_close_negative_controls.py
      - name: Recheck native TLS slow HTTP socket close timing
        run: python3 tools/verify_native_tls_slow_close_corpus.py
      - name: Reject a late native TLS slow HTTP socket close
        run: python3 tools/verify_native_tls_slow_close_negative_controls.py
      - name: Recheck fresh exact-main native TLS slow HTTP closes
        run: python3 tools/verify_native_current_tls_slow_close_corpus.py
      - name: Recheck native three-cycle interruption evidence
        run: python3 tools/verify_native_current_three_cancellation.py
      - name: Recheck retained native three-cycle cancellation packets
        run: python3 tools/verify_native_cancel_pcap_corpus.py
      - name: Reject late native cancellation socket closure
        run: python3 tools/verify_native_cancel_pcap_negative_controls.py
      - name: Recheck current-package native slow HTTP socket closes
        run: python3 tools/verify_native_current_slow_close_corpus.py
      - name: Recheck saved operator configuration upgrade evidence
        run: python3 tools/verify_saved_operator_config_evidence.py
      - name: Recheck native synthetic-exfiltration packet evidence
        run: python3 tools/verify_native_exfil_corpus.py
      - name: Recheck native Codex and Claude EOF and active-HTTP EOF captures
        run: python3 tools/verify_native_eof_corpus.py
      - name: Recheck native held encoded-response packet evidence
        run: python3 tools/verify_native_held_encoded_corpus.py
      - name: Recheck before and after native held-response upgrade captures
        run: python3 tools/verify_native_held_two_phase_upgrade_corpus.py
      - name: Reject altered native held encoded-response captures
        run: python3 tools/verify_native_held_encoded_negative_controls.py
      - name: Recheck exact trusted-main native rebinding captures
        run: python3 tools/verify_exact_main_rebind_corpus.py
  sdk-audit:
    name: Locked ${{ matrix.probe.name }} npm audit
    strategy:
      fail-fast: false
      matrix:
        probe:
          - {name: SDK, id: sdk, path: tools/mcp-sdk-probe}
          - {name: Inspector, id: inspector, path: tools/mcp-inspector-probe}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Record development audit tools and lockfile identity
        run: |
          node --version > sdk-audit-tools.txt
          npm --version >> sdk-audit-tools.txt
          sha256sum "${{ matrix.probe.path }}/package-lock.json" > sdk-audit-lockfile.sha256
      - name: Audit all locked probe dependency classes without installing code
        run: npm audit --prefix "${{ matrix.probe.path }}" --package-lock-only --include=dev --include=optional --include=peer --ignore-scripts --audit-level=low --json > sdk-npm-audit.json
      - name: Require complete zero-finding audit response
        run: python3 -c 'import json; r=json.load(open("sdk-npm-audit.json")); assert "error" not in r; assert r["auditReportVersion"] == 2; assert r["metadata"]["vulnerabilities"]["total"] == 0'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: locked-${{ matrix.probe.id }}-advisory-report
          path: |
            sdk-npm-audit.json
            sdk-audit-tools.txt
            sdk-audit-lockfile.sha256
          retention-days: 7
  rustsec-audit:
    name: Full-lock RustSec audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Read pinned build compiler
        id: compiler
        run: python3 -c 'import os, tomllib; channel = tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"]; print("channel=" + channel, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
      - name: Install pinned development auditor
        run: cargo install cargo-audit --locked --version 0.22.2 --debug
      - name: Fetch fresh advisory database and record identity
        run: |
          git clone --depth 1 https://github.com/RustSec/advisory-db.git advisory-db
          git -C advisory-db rev-parse HEAD > advisory-db-commit.txt
          cargo audit --version > auditor-version.txt
      - name: Audit the entire lockfile without exemptions
        run: cargo audit --db advisory-db --no-fetch --no-yanked --deny warnings --json > rustsec-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: rustsec-lockfile-report
          path: |
            rustsec-report.json
            advisory-db-commit.txt
            auditor-version.txt
          retention-days: 7
  policy-fuzz:
    name: LLVM ${{ matrix.target }} fuzz campaign
    strategy:
      fail-fast: false
      matrix:
        target: [policy, frame, rpc, json, http, wire, dns]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Read pinned compiler
        id: compiler
        run: python3 -c 'import os,tomllib; print("channel="+tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"],file=open(os.environ["GITHUB_OUTPUT"],"a"))'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
      - name: Install development LLVM runtime and fetch locked crates
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-rt-18-dev
          cargo fetch --locked
      - name: Run network-free coverage-guided policy campaign
        run: |
          export LIBFUZZER_RUNTIME="$(clang-18 --print-file-name=libclang_rt.fuzzer_no_main-x86_64.a)"
          export POLICY_FUZZ_CLANG=clang-18
          export POLICY_FUZZ_TARGET="${{ matrix.target }}"
          export POLICY_FUZZ_OUTPUT="$RUNNER_TEMP/${{ matrix.target }}-fuzz-evidence"
          bash tools/policy_fuzz.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: llvm-${{ matrix.target }}-fuzz-evidence
          path: ${{ runner.temp }}/${{ matrix.target }}-fuzz-evidence
          retention-days: 7
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0 # Candidate Debian versions use the complete Git ancestry count.
      - name: Read pinned build compiler
        id: compiler
        run: python3 -c 'import os, tomllib; channel = tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"]; print("channel=" + channel, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - name: Prove raw HTTP fuzzer reaches a valid parsed response
        run: cargo test --locked --features policy-fuzz --lib raw_wire_oracle_tracks_strict_framing_cases_through_hyper
      - name: Verify retained HTTP framing fuzz corpus
        run: python3 tools/verify_fuzz_archive.py tests/fixtures/http-fuzz/local-corpus.tar.gz tests/fixtures/http-fuzz/local-report.json --max-member-bytes 512
      - name: Verify retained raw HTTP wire fuzz corpus
        run: python3 tools/verify_fuzz_archive.py tests/fixtures/wire-fuzz/local-corpus.tar.gz tests/fixtures/wire-fuzz/local-report.json --max-member-bytes 4096
      - name: Verify retained raw HTTP framing oracle corpus
        run: python3 tools/verify_fuzz_archive.py tests/fixtures/wire-fuzz/oracle-local-corpus.tar.gz tests/fixtures/wire-fuzz/oracle-local-report.json --max-member-bytes 4096
      - name: Verify retained DNS answer-set fuzz corpus
        run: python3 tools/verify_fuzz_archive.py tests/fixtures/dns-fuzz/local-corpus.tar.gz tests/fixtures/dns-fuzz/local-report.json --max-member-bytes 64
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --lib --features policy-fuzz --locked -- -D warnings
      - run: cargo build --locked --bins --examples
      - run: python3 tools/iana_ip_policy_probe.py target/debug/examples/ip_policy_probe
      - run: python3 tools/cli_smoke.py target/debug/outbound-guard-mcp "$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
      - run: python3 tools/adversarial_stdio_probe.py target/debug/outbound-guard-mcp
      - name: Ensure adversarial probe tools
        run: |
          if ! command -v strace; then
            sudo apt-get update
            sudo apt-get install -y strace
          fi
          if ! command -v nft; then
            sudo apt-get update
            sudo apt-get install -y nftables
          fi
      - run: python3 tools/syscall_denial_probe.py target/debug/outbound-guard-mcp
      - run: python3 tools/modern_stdio_probe.py target/debug/outbound-guard-mcp
      - run: python3 tools/protocol_id_probe.py target/debug/outbound-guard-mcp
      - run: python3 -W error::ResourceWarning tools/stdio_mutation_probe.py target/debug/outbound-guard-mcp
      - run: python3 -m py_compile tools/client_cancellation_probe.py tools/client_cancellation_fixture.py tools/client_wire_bridge.py
      - run: python3 tools/stdio_resource_probe.py target/debug/outbound-guard-mcp
      - run: npm ci --prefix tools/mcp-sdk-probe --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix tools/mcp-inspector-probe --ignore-scripts --no-audit --no-fund
      - run: echo "OUTBOUND_GUARD_TEST_SDK_DIR=$GITHUB_WORKSPACE/tools/mcp-sdk-probe" >> "$GITHUB_ENV"
      - run: bash tools/netns_adversarial_probe.sh target/debug/outbound-guard-mcp
      - name: Verify retained forged DNS transaction-ID evidence
        run: python3 tools/verify_dns_spoof_evidence.py
      - run: python3 tools/inspector_smoke.py target/debug/outbound-guard-mcp
      - run: python3 tools/package_candidate.py --container-build --output dist/candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: experimental-candidate-linux-x86_64
          path: dist/candidate/
          retention-days: 7
          if-no-files-found: error

  msrv:
    name: Rust 1.89 minimum compiler
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.2
        with:
          key: msrv-1.89.0
      - name: Verify the tested version matches the package minimum
        run: python3 -c 'import tomllib; assert tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"] == "1.89"'
      - run: cargo +1.89.0 test --locked --all-targets
      - run: cargo +1.89.0 build --locked --bins --examples
      - run: python3 tools/iana_ip_policy_probe.py target/debug/examples/ip_policy_probe
      - run: python3 tools/cli_smoke.py target/debug/outbound-guard-mcp "$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
      - run: python3 tools/modern_stdio_probe.py target/debug/outbound-guard-mcp
      - run: python3 tools/protocol_id_probe.py target/debug/outbound-guard-mcp

  independent-rebuild:
    name: Independent native rebuild
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0 # Match the primary candidate's version ancestry.
      - name: Read pinned build compiler
        id: compiler
        run: python3 -c 'import os, tomllib; channel = tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"]; print("channel=" + channel, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
      # No compiler/target cache restore: this job independently rebuilds in its own container/cache.
      - name: Fetch locked sources for the host-side notice inventory
        run: cargo fetch --locked
      - name: Ensure adversarial probe tools
        run: |
          if ! command -v strace; then
            sudo apt-get update
            sudo apt-get install -y strace
          fi
          if ! command -v nft; then
            sudo apt-get update
            sudo apt-get install -y nftables
          fi
      - run: npm ci --prefix tools/mcp-sdk-probe --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix tools/mcp-inspector-probe --ignore-scripts --no-audit --no-fund
      - run: echo "OUTBOUND_GUARD_TEST_SDK_DIR=$GITHUB_WORKSPACE/tools/mcp-sdk-probe" >> "$GITHUB_ENV"
      - name: Independently build and adversarially test installed candidate
        run: python3 tools/package_candidate.py --container-build --output dist/rebuild
      # Download the primary bytes only AFTER independently compiling/testing this candidate.
      - name: Download the tested primary candidate from this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name experimental-candidate-linux-x86_64 --dir dist/primary
      - name: Check both archive manifests
        run: |
          (cd dist/primary && sha256sum -c SHA256SUMS)
          (cd dist/rebuild && sha256sum -c SHA256SUMS)
      - name: Require matching independent source, settings and executable bytes
        run: python3 tools/compare_candidates.py dist/primary/*.tar.gz dist/rebuild/*.tar.gz > dist/rebuild-comparison.json
      - name: Require identical Debian package bytes
        run: cmp dist/primary/*.deb dist/rebuild/*.deb
      - name: Retain comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: independent-rebuild-comparison-linux-x86_64
          path: dist/rebuild-comparison.json
          retention-days: 7
          if-no-files-found: warn

  attest-candidate:
    name: Sign verified candidate provenance
    needs: [rust, independent-rebuild, rustsec-audit, sdk-audit, policy-fuzz]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'rhamenator/outbound-guard-mcp'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download tested candidate and matching rebuild evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name experimental-candidate-linux-x86_64 --dir dist/candidate
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name independent-rebuild-comparison-linux-x86_64 --dir dist/evidence
      - name: Validate artifact bytes against successful independent comparison
        run: |
          (cd dist/candidate && sha256sum -c SHA256SUMS)
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          report = json.loads(Path('dist/evidence/rebuild-comparison.json').read_text())
          assert report['matching'] is True and report['differences'] == []
          archives = list(Path('dist/candidate').glob('*.tar.gz'))
          assert len(archives) == 1
          assert report['left']['archive_sha256'] == hashlib.sha256(archives[0].read_bytes()).hexdigest()
          assert report['left']['revision'] == report['right']['revision'] == os.environ['GITHUB_SHA']
          assert report['left']['binary_sha256'] == report['right']['binary_sha256']
          assert len(list(Path('dist/candidate').glob('*.deb'))) == 1
          PYCODE
      - name: Attest experimental archives and checksum manifest
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/candidate/*
          push-to-registry: false
          create-storage-record: false
      - name: Verify signatures and exact trusted workflow/source identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          for artifact in dist/candidate/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --deny-self-hosted-runners --format json > "$artifact.verification.json"
          done
          archive=$(find dist/candidate -maxdepth 1 -name '*.tar.gz' -print -quit)
          cp "$archive" dist/tampered-candidate.tar.gz
          printf '\000' >> dist/tampered-candidate.tar.gz
          if gh attestation verify dist/tampered-candidate.tar.gz --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Tampered candidate unexpectedly verified'
            exit 1
          fi
          if gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" --source-digest 0000000000000000000000000000000000000000 >/dev/null 2>&1; then
            echo 'Incorrect source identity unexpectedly verified'
            exit 1
          fi
      - name: Retain signed bundle and verifier results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: experimental-candidate-provenance-linux-x86_64
          path: |
            ${{ steps.attest.outputs.bundle-path }}
            dist/candidate/*.verification.json
          retention-days: 7
          if-no-files-found: error
